services:
  api:
    build: .
    container_name: rag-enterprise-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    container_name: rag-enterprise-ui
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    command: streamlit run app/ui.py --server.address 0.0.0.0 --server.port 8501

